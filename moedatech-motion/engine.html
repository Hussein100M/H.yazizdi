:root{--or:#ff6512;--or2:#ff8a3d;--ink:#263a4f;--grey:#85909e;--cream:#e9edf2;--navy:#263a4f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#e9edf2;font-family:Rx,In,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
.ar{direction:rtl}
.L{position:absolute;inset:0;overflow:hidden}
.ab{position:absolute}
.num{font-family:In;font-variant-numeric:tabular-nums;direction:ltr}
/* backgrounds */
#bgDark{background:linear-gradient(180deg,#4a627c 0%,#33495f 38%,#1f3044 72%,#121e2c 100%)}
#glow{position:absolute;left:-240px;right:-240px;bottom:-330px;height:900px;background:radial-gradient(ellipse at 50% 62%,rgba(255,104,18,.95) 0%,rgba(255,104,18,.55) 26%,rgba(255,104,18,0) 62%);filter:blur(10px)}
.dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.075) 1.3px,transparent 1.8px) 0 0/30px 30px}
.dotsL{position:absolute;inset:0;background:radial-gradient(circle,rgba(20,40,70,.06) 1.3px,transparent 1.8px) 0 0/30px 30px}
#bgLight{background:radial-gradient(ellipse at 50% 42%,#f6f8fa 0%,#e8ecf0 55%,#d5dce4 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 58%,rgba(8,18,32,.16) 100%);pointer-events:none}
#flash{background:radial-gradient(ellipse at 50% 55%,#ff8a2c 0%,#ff6a12 55%,#f2540a 100%)}
/* tiles & cards */
.tile{position:absolute;background:#f0f3f6;border-radius:36px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 2px rgba(25,40,60,.06),0 26px 50px -26px rgba(25,40,60,.32);overflow:hidden}
.tl{position:absolute;top:22px;right:30px;font-size:22px;font-weight:500;color:#85909e;direction:rtl;white-space:nowrap}
.tl b{font-family:In;font-weight:600;font-size:17px;color:#a9b2bd;margin-left:10px}
.card{position:absolute;background:#fcfdfe;border-radius:42px;box-shadow:0 34px 70px -24px rgba(20,35,55,.34),0 2px 6px rgba(20,35,55,.06);overflow:hidden}
.photo{position:absolute;overflow:hidden;background:linear-gradient(180deg,#f9dcc0 0%,#f6e9dc 58%,#d8cab8 58.5%,#cdbda8 100%)}
.photo .sun{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,210,.95),rgba(255,236,210,0) 70%);right:-60px;top:-90px}
.photo.b{background:linear-gradient(180deg,#d9e2ea 0%,#eef0ee 58%,#d3c8b8 58.5%,#c4b7a4 100%)}
.photo.c{background:linear-gradient(180deg,#f3cfae 0%,#efd9c5 58%,#cdb79f 58.5%,#bfa88f 100%)}
.chip{position:absolute;display:flex;align-items:center;gap:12px;padding:12px 24px 12px 20px;border-radius:40px;background:#fff;font-size:27px;font-weight:500;white-space:nowrap;direction:rtl;box-shadow:0 10px 24px -10px rgba(20,35,55,.35),0 1px 2px rgba(20,35,55,.08)}
.ck{width:32px;height:32px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center;flex:none}
.ck svg{width:20px;height:20px}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:60px;white-space:nowrap;direction:rtl}
.lbl{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;direction:rtl}
.lbl span{display:inline-block;margin:0 9px}
.big{font-weight:700;letter-spacing:-1px}
.row{position:absolute;left:44px;right:44px;height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e8ecf0;direction:rtl;font-size:30px;font-weight:500}
.row .k{color:#85909e;font-weight:400}
.ckc{width:40px;height:40px;border-radius:50%;border:3px solid #d0d7df;display:flex;align-items:center;justify-content:center}
.ckc svg{width:24px;height:24px}
.ghost{color:#aab3be}
.av{position:absolute;border-radius:50%;background:linear-gradient(160deg,#3d5873,#22344a);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -12px rgba(8,18,32,.55)}
.bub{position:absolute;padding:20px 30px;border-radius:34px;font-size:32px;font-weight:500;white-space:nowrap;direction:rtl;box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.roll{display:inline-block;overflow:hidden;vertical-align:top;position:relative}
.roll i{display:block;font-style:normal;text-align:center}
svg{overflow:visible}
