<script>
const T=CFG.text, DT=1/30, NS='http://www.w3.org/2000/svg', D=28;
document.documentElement.style.setProperty('--acc',ACC);
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-k,3), ei=k=>k*k*k;
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const ex=k=>k>=1?1:1-Math.pow(2,-10*k);
const back=(k,s=1.7)=>{const c3=s+1;return 1+c3*Math.pow(k-1,3)+s*Math.pow(k-1,2)};
const show=(el,on)=>{el.style.display=on?'block':'none';return on};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let MBN=0;const DEFS=$('defs');
function mb(el,bx,by,extra=0){
  bx=Math.min(90,Math.max(0,Math.abs(bx)-1.5));by=Math.min(90,Math.max(0,Math.abs(by)-1.5));
  const css=extra>.3?` blur(${extra.toFixed(2)}px)`:'';
  if(bx<.4&&by<.4){el.style.filter=css.trim();return}
  let f=el._mbf;
  if(!f){f=document.createElementNS(NS,'filter');f.id='mb'+(++MBN);f.setAttribute('filterUnits','userSpaceOnUse');f.setAttribute('color-interpolation-filters','sRGB');f.appendChild(document.createElementNS(NS,'feGaussianBlur'));DEFS.appendChild(f);el._mbf=f}
  const w=el.offsetWidth,h=el.offsetHeight,mx=3*bx+12,my=3*by+12;
  f.setAttribute('x',-mx);f.setAttribute('y',-my);f.setAttribute('width',w+2*mx);f.setAttribute('height',h+2*my);
  f.firstChild.setAttribute('stdDeviation',bx.toFixed(2)+' '+by.toFixed(2));
  el.style.filter=`url(#${f.id})`+css;
}
// element visibility helpers
function fadeBlur(el,t,a,d=.4,dy=20,out=null,od=.25){let k=p(t,a,a+d),e=eo(k),o=k,b=(1-e)*14,y=(1-e)*dy;
  if(out!=null){const q=p(t,out,out+od);o*=1-q;b+=q*12;y-=q*16}
  el.style.opacity=o;el.style.filter=b>.3?`blur(${b.toFixed(2)}px)`:'';el.style.transform=`translateY(${y.toFixed(2)}px)`;}
function mask(el,t,a,d=.55,out=null,od=.25){const s=el.firstElementChild,k=eo(p(t,a,a+d));s.style.transform=`translateY(${((1-k)*112).toFixed(2)}%)`;
  let o=k>0?1:0;if(out!=null){const q=p(t,out,out+od);o*=1-q;el.style.filter=q>0?`blur(${q*12}px)`:''}el.style.opacity=o;}
const stack=(mode,pre)=>{const a=mode==='frame'?CFG.assets.site:(CFG.assets.hero);
  if(a)return `<div class="lay" id="${pre}bld"><img class="cov" src="${a}"></div>`;
  return `<div class="lay" id="${pre}sky">${skySVG(mode)}</div><div class="lay" id="${pre}city">${citySVG(mode)}</div><div class="lay" id="${pre}bld">${buildingSVG(mode)}</div><div class="lay" id="${pre}fg">${fgSVG(mode)}</div>`};
const DEP={sky:.15,city:.4,bld:1,fg:1.3};
function parallax(pre,z,px,py){for(const n in DEP){const e=$(pre+n);if(!e)continue;const d=DEP[n];e.style.transform=`translate(${(px*d).toFixed(2)}px,${(py*d).toFixed(2)}px) scale(${(1+(z-1)*d).toFixed(4)})`}}
const ICON={mail:'<path d="M4 7h20v14H4z M4 7l10 8 10-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
  phone:'<path d="M9 4h4l2 5-3 2c1.2 2.6 3.4 4.8 6 6l2-3 5 2v4c0 1.1-.9 2-2 2C12.7 22 6 15.3 6 6c0-1.1.9-2 2-2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
  at:'<circle cx="14" cy="14" r="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M18.5 14v1.6c0 1.6 1.2 2.6 2.6 2.6S24 17 24 15v-1c0-5.5-4.5-10-10-10S4 8.5 4 14s4.5 10 10 10c2 0 3.8-.5 5.3-1.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'};
const ico=n=>`<svg width="30" height="30" viewBox="0 0 28 28" style="color:${ACC}">${ICON[n]}</svg>`;

// ================= BUILD =================
// PDF (static deck)
$('Lpdf').innerHTML=`<div id="pdf_bar"><span><i></i>Project_Presentation_FINAL_v7.pdf</span><span>1 / 24 &nbsp;·&nbsp; 100%</span></div>
 <div id="pdf_page"><div class="pg_h">PROJECT OVERVIEW</div>${[[110,380],[140,330],[170,360],[200,250],[262,370],[292,310],[322,340],[352,200]].map(([y,w])=>`<div class="pg_b" style="top:${y}px;width:${w}px"></div>`).join('')}
 <div class="pg_cap">Fig. 1 — Exterior view</div><div class="pg_f">Company Name · 2026</div></div>
 <div id="pdf_th">${'<i></i>'.repeat(6)}</div>`;
// hero
$('hbox').innerHTML=stack('final','h')+`<div id="hscrim"></div>`;
// slot: the hero sits inside the PDF page at (480+60, 100+690) as a 420x300 picture
const SLOT={x:540,y:790,w:420,h:300}, CROP={x:140,y:520,w:900,h:643}, K0=SLOT.w/CROP.w;
// interior
