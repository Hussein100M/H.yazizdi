const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), p = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - k, 3), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const back = (k, s = 1.5) => { const c3 = s + 1; return 1 + c3 * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const $ = id => document.getElementById(id);
const [vx, vy, vw, vh] = $('logo').getAttribute('viewBox').split(' ').map(Number);
const bb = $('dark').getBBox(), lb = $('light').getBBox(), wb = $('word').getBBox();
function blurIn(el, t, a, d, dy) { const k = p(t, a, a + d), e = eo(k); el.style.opacity = k; el.style.filter = `blur(${(1 - e) * 12}px)`; el.style.transform = `translateY(${(1 - e) * dy}px)`; }
window.seek = t => {
  const u = t - T0;                                   // seconds into the end card
  $('shade').style.opacity = eio(p(u, 0, 1.0));
  $('card').style.transform = `scale(${lerp(.985, 1.025, p(u, 0, 4.7))})`;
  // dark wall wipes in from the right edge
  const dk = eio(p(u, .15, .75)); $('drect').setAttribute('x', bb.x + bb.width * (1 - dk)); $('drect').setAttribute('width', bb.width * dk + 2);
  // light faces slide in from the left
  const lk = back(p(u, .35, .9), 1.2); $('lightG').setAttribute('transform', `translate(${(1 - cl(lk, 0, 1.2)) * -260},0)`); $('light').style.opacity = cl(p(u, .35, .6));
  // glow pulse when the icon locks
  const g = Math.exp(-Math.max(0, u - .85) * 2.2) * p(u, .7, .85); $('iconG').style.filter = `drop-shadow(0 0 ${10 + 40 * g}px rgba(60,200,180,${.25 + .55 * g}))`;
  // wordmark wipes left -> right
  const wk = eio(p(u, .75, 1.45)); $('wrect').setAttribute('x', wb.x - 10); $('wrect').setAttribute('width', (wb.width + 20) * wk);
  $('word').style.opacity = cl(wk * 3);
  // shine sweep
  const sk = p(u, 1.5, 2.2); $('shine').setAttribute('opacity', sk > 0 && sk < 1 ? .9 : 0);
  const sx = lerp(vx - 900, vx + vw + 200, eio(sk)); const gr = $('sh'); gr.setAttribute('x1', sx); gr.setAttribute('x2', sx + 700);
  // accent line, name, contacts
  $('line').style.width = 520 * eio(p(u, 1.55, 2.1)) + 'px'; $('line').style.opacity = 1;
  blurIn($('name'), u, 1.8, .55, 20);
  blurIn($('contact'), u, 2.4, .55, 14);
};
window.READY = document.fonts.ready.then(() => { seek(T0); return true; });
</script>
